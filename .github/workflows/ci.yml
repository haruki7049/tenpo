name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    name: Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake
        run: nix flake check
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Build
        run: nix develop --command cabal build all
      - name: Test
        run: nix develop --command cabal test all

  cabal:
    name: Cabal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            libxi-dev libxrandr-dev libxxf86vm-dev libxcursor-dev libxinerama-dev
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14"
          cabal-version: latest
      - name: Configure
        run: cabal configure --enable-tests --enable-documentation
      - name: Freeze dependencies
        run: cabal freeze
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all
